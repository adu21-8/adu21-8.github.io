<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}</style>
<title>Orrery Sequencer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one full-bleed canvas instrument; a title plate top-left, a readout top-right, a brass control rail along the bottom. Deliberately single dark theme (night sky). */
  :root {
    --void: #0a0c19;
    --void-2: #12152b;
    --brass: #d6aa55;
    --brass-soft: rgba(214, 170, 85, 0.32);
    --text: #ece6d6;
    --muted: #8f8ca8;
    --rail: rgba(14, 16, 34, 0.82);
    --font-display: "Italiana", "Didot", "Bodoni 72", Georgia, serif;
    --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--void);
    color: var(--text);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: crosshair; }

  .plate {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    pointer-events: none;
  }
  .plate h1 {
    margin: 0; font-family: var(--font-display); font-weight: 400;
    font-size: clamp(30px, 5vw, 44px); letter-spacing: 0.06em; line-height: 1;
    color: var(--brass); text-wrap: balance;
  }
  .plate .sub {
    margin: 6px 0 0; font-size: 13px; color: var(--muted); max-width: 34ch; line-height: 1.45;
  }
  .readout {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); text-align: right; line-height: 1.7; font-variant-numeric: tabular-nums;
  }
  .readout b { color: var(--text); font-weight: 500; }
  .readout .law { color: var(--brass); }

  .rail {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--rail);
    border-top: 1px solid var(--brass-soft);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .rail-inner {
    max-width: 1080px; margin: 0 auto;
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  }
  .group { display: flex; align-items: center; gap: 8px; }
  .label {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  }
  button, select {
    font: 500 13px/1 var(--font-body); color: var(--text);
    background: transparent; border: 1px solid var(--brass-soft); border-radius: 2px;
    padding: 9px 12px; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--brass); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  button.primary { background: var(--brass); color: var(--void); border-color: var(--brass); font-weight: 600; }
  button.primary[aria-pressed="true"] { background: transparent; color: var(--brass); }
  select { background: var(--void-2); padding-right: 8px; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button + button { border-left: none; }
  .seg button[aria-pressed="true"] { background: var(--brass-soft); color: var(--text); border-color: var(--brass); }
  input[type="range"] { accent-color: var(--brass); width: 110px; }
  .tempo-val { font-family: var(--font-mono); font-size: 12px; min-width: 4ch; font-variant-numeric: tabular-nums; }
  .spacer { flex: 1 1 0; }
  .hint { font-size: 12px; color: var(--muted); }

  @media (max-width: 640px) {
    .plate .sub { display: none; }
    .readout { font-size: 10px; }
    .hint { display: none; }
    .spacer { display: none; }
    input[type="range"] { width: 84px; }
    button, select { padding: 8px 10px; font-size: 12px; }
    .rail-inner { gap: 8px 12px; }
  }
</style>

</head>
<body>
<canvas id="sky" aria-label="Orbital sequencer. Planets play a note each time they cross the vertical meridian line."></canvas>

<header class="plate" id="plate">
  <div>
    <h1>Orrery</h1>
    <p class="sub">Each planet rings its note as it crosses the brass meridian. Inner orbits are higher and faster. Tap a ring to place a planet; tap a planet to remove it.</p>
  </div>
  <div class="readout" aria-live="polite">
    <div><b id="ro-count">0</b> bodies</div>
    <div class="law" id="ro-law">T² ∝ r³</div>
    <div id="ro-cycle">&nbsp;</div>
  </div>
</header>

<footer class="rail" id="rail">
  <div class="rail-inner">
    <button class="primary" id="sound" aria-pressed="false">Turn on sound</button>
    <button id="play" aria-pressed="true">Pause</button>
    <div class="group">
      <span class="label">Law</span>
      <div class="seg" role="group" aria-label="Orbit law">
        <button id="law-kepler" aria-pressed="true" title="Period grows with radius to the 1.5 power, as with real planets">Kepler</button>
        <button id="law-res" aria-pressed="false" title="Periods in whole-number ratios, so the pattern repeats">Resonant</button>
      </div>
    </div>
    <div class="group">
      <label class="label" for="scale">Scale</label>
      <select id="scale"></select>
    </div>
    <div class="group">
      <label class="label" for="tempo">Tempo</label>
      <input type="range" id="tempo" min="0.4" max="2.5" step="0.05" value="1">
      <span class="tempo-val" id="tempo-val">1.00×</span>
    </div>
    <span class="spacer"></span>
    <button id="random">New system</button>
    <button id="clear">Clear</button>
  </div>
</footer>

<script>
(() => {
  const N = 8;                 // rings
  const BASE_T = 2.4;          // seconds for innermost orbit at 1× tempo
  const ROOT_MIDI = 57;        // A3
  const MAX_PLANETS = 28;
  const NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  const SCALES = {
    'Major pentatonic': [0,2,4,7,9,12,14,16],
    'Minor pentatonic': [0,3,5,7,10,12,15,17],
    'Lydian': [0,2,4,6,7,9,11,12],
    'In scale': [0,1,5,7,8,12,13,17],
    'Whole tone': [0,2,4,6,8,10,12,14],
  };
  const HUES = ['#f4cd75','#f2a46c','#ea7a8c','#cf82d9','#9a8ff2','#6aaeea','#5ec8c0','#a5d68c'];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = id => document.getElementById(id);
  const canvas = $('sky'), ctx = canvas.getContext('2d');

  const state = { planets: [], law: 'kepler', scale: 'Major pentatonic', tempo: 1, playing: !reduceMotion, sound: false };
  const fx = { ringFlash: new Array(N).fill(0), sun: 0, ripples: [] };
  const geom = { w: 0, h: 0, dpr: 1, cx: 0, cy: 0, r: [], gap: 0 };
  let stars = [];

  // ---------- music + orbit math ----------
  const radiusNorm = i => 1 + i * 0.45;
  function period(i) {
    const t = state.law === 'kepler' ? BASE_T * Math.pow(radiusNorm(i), 1.5) : BASE_T * (i + 2) / 2;
    return t / state.tempo;
  }
  const midiOf = i => ROOT_MIDI + SCALES[state.scale][N - 1 - i];
  const nameOf = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);

  // ---------- audio ----------
  let ac = null, master, send;
  function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 4;
    comp.connect(ac.destination);
    master = ac.createGain(); master.gain.value = 0.55; master.connect(comp);
    const delay = ac.createDelay(2); delay.delayTime.value = 0.36;
    const fb = ac.createGain(); fb.gain.value = 0.4;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1900;
    send = ac.createGain(); send.gain.value = 0.32;
    send.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(master);
    return true;
  }
  function voice(type, freq, peak, decay, t, out) {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + decay + 0.05);
  }
  function playNote(midi, vel, pan) {
    if (!ac || !state.sound) return;
    const t = ac.currentTime + 0.005;
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const out = ac.createGain(); out.gain.value = vel;
    let node = out;
    if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; out.connect(p); node = p; }
    node.connect(master); node.connect(send);
    const decay = 1.1 + Math.max(0, 76 - midi) * 0.06;
    voice('sine', f, 0.5, decay, t, out);
    voice('triangle', f * 2, 0.07, decay * 0.6, t, out);
    voice('sine', f * 2.76, 0.06, decay * 0.25, t, out);  // bell-like inharmonic partial
  }

  // ---------- geometry ----------
  function layout() {
    geom.dpr = Math.min(window.devicePixelRatio || 1, 2);
    geom.w = window.innerWidth; geom.h = window.innerHeight;
    canvas.width = Math.round(geom.w * geom.dpr); canvas.height = Math.round(geom.h * geom.dpr);
    const top = $('plate').getBoundingClientRect().bottom + 12;
    const bottom = $('rail').getBoundingClientRect().top - 14;
    const avail = Math.max(120, bottom - top);
    geom.cx = geom.w / 2;
    geom.cy = top + avail / 2;
    const maxR = Math.max(60, Math.min(geom.w / 2 - 24, avail / 2 - 6));
    const r0 = maxR * 0.2;
    geom.gap = (maxR - r0) / (N - 1);
    geom.r = Array.from({ length: N }, (_, i) => r0 + i * geom.gap);
    if (!stars.length) {
      stars = Array.from({ length: 220 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.2 + 0.2, p: Math.random() * 6.28 }));
    }
  }

  // ---------- planets ----------
  function addPlanet(ring, phase, size) {
    if (state.planets.length >= MAX_PLANETS) return;
    state.planets.push({ ring, phase, size: size ?? 4 + Math.random() * 4, flash: 0 });
  }
  function seed() {
    state.planets = [];
    [[0,0.1],[2,0.55],[3,0.3],[5,0.8],[7,0.05],[4,0.7]].forEach(([r,p]) => addPlanet(r, p, 4 + r * 0.5));
  }
  function randomSystem() {
    state.planets = [];
    const n = 5 + Math.floor(Math.random() * 4);
    for (let k = 0; k < n; k++) addPlanet(Math.floor(Math.random() * N), Math.random());
  }
  const planetXY = p => {
    const a = -Math.PI / 2 + p.phase * Math.PI * 2;
    const r = geom.r[p.ring];
    return [geom.cx + Math.cos(a) * r, geom.cy + Math.sin(a) * r];
  };

  function trigger(p) {
    p.flash = 1;
    fx.ringFlash[p.ring] = 1;
    fx.sun = Math.min(1.4, fx.sun + 0.35);
    if (!reduceMotion) fx.ripples.push({ x: geom.cx, y: geom.cy - geom.r[p.ring], t: 0, c: HUES[p.ring] });
    const vel = 0.35 + (p.size - 4) * 0.06;
    playNote(midiOf(p.ring), vel, (p.ring % 2 ? 1 : -1) * 0.12 * (p.ring / N));
  }

  // ---------- input ----------
  canvas.addEventListener('pointerdown', e => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    for (let k = state.planets.length - 1; k >= 0; k--) {
      const [px, py] = planetXY(state.planets[k]);
      if (Math.hypot(px - x, py - y) < Math.max(14, state.planets[k].size + 9)) {
        state.planets.splice(k, 1); updateReadout(); return;
      }
    }
    const d = Math.hypot(x - geom.cx, y - geom.cy);
    let best = -1, bestD = Infinity;
    geom.r.forEach((r, i) => { const dd = Math.abs(r - d); if (dd < bestD) { bestD = dd; best = i; } });
    if (best < 0 || bestD > geom.gap * 0.55) return;
    let phase = (Math.atan2(y - geom.cy, x - geom.cx) + Math.PI / 2) / (Math.PI * 2);
    phase = ((phase % 1) + 1) % 1;
    addPlanet(best, phase);
    fx.ringFlash[best] = Math.max(fx.ringFlash[best], 0.5);
    updateReadout();
  });

  // ---------- controls ----------
  const scaleSel = $('scale');
  Object.keys(SCALES).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = k; scaleSel.appendChild(o); });

  function lcmCycle() {
    if (state.law !== 'resonant' || !state.planets.length) return null;
    const gcd = (a, b) => b ? gcd(b, a % b) : a;
    const rings = [...new Set(state.planets.map(p => p.ring + 2))];
    let l = rings.reduce((a, b) => a * b / gcd(a, b), 1);
    return (BASE_T * l / 2) / state.tempo;
  }
  function updateReadout() {
    $('ro-count').textContent = state.planets.length;
    $('ro-law').textContent = state.law === 'kepler' ? 'Kepler · T² ∝ r³' : 'Resonant · T ∝ n';
    const c = lcmCycle();
    $('ro-cycle').textContent = c ? `repeats every ${c < 120 ? c.toFixed(1) + ' s' : (c / 60).toFixed(1) + ' min'}` : (state.law === 'kepler' ? 'never quite repeats' : ' ');
  }
  function syncControls() {
    $('law-kepler').setAttribute('aria-pressed', state.law === 'kepler');
    $('law-res').setAttribute('aria-pressed', state.law === 'resonant');
    scaleSel.value = state.scale;
    $('tempo').value = state.tempo;
    $('tempo-val').textContent = state.tempo.toFixed(2) + '×';
    $('play').textContent = state.playing ? 'Pause' : 'Play';
    $('play').setAttribute('aria-pressed', state.playing);
    $('sound').textContent = state.sound ? 'Sound on' : 'Turn on sound';
    $('sound').setAttribute('aria-pressed', state.sound);
    updateReadout();
  }

  $('sound').addEventListener('click', async () => {
    if (!ac && !initAudio()) { $('sound').textContent = 'No audio support'; return; }
    if (ac.state === 'suspended') { try { await ac.resume(); } catch (_) {} }
    state.sound = !state.sound;
    if (state.sound && !state.playing) state.playing = true;
    syncControls();
  });
  $('play').addEventListener('click', () => { state.playing = !state.playing; syncControls(); });
  $('law-kepler').addEventListener('click', () => { state.law = 'kepler'; syncControls(); });
  $('law-res').addEventListener('click', () => { state.law = 'resonant'; syncControls(); });
  scaleSel.addEventListener('change', () => { state.scale = scaleSel.value; syncControls(); });
  $('tempo').addEventListener('input', e => { state.tempo = parseFloat(e.target.value); syncControls(); });
  $('random').addEventListener('click', () => { randomSystem(); syncControls(); });
  $('clear').addEventListener('click', () => { state.planets = []; syncControls(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && !/SELECT|INPUT|BUTTON/.test(document.activeElement.tagName)) {
      e.preventDefault(); state.playing = !state.playing; syncControls();
    }
  });
  window.addEventListener('resize', layout);

  // ---------- drawing ----------
  function draw(time) {
    const { w, h, cx, cy, dpr } = geom;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * 0.75);
    bg.addColorStop(0, '#171a36'); bg.addColorStop(1, '#0a0c19');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

    for (const s of stars) {
      const tw = reduceMotion ? 0.6 : 0.45 + 0.35 * Math.sin(time * 0.0008 + s.p);
      ctx.fillStyle = `rgba(236,230,214,${tw * 0.55})`;
      ctx.fillRect(s.x * w, s.y * h, s.s, s.s);
    }

    // rings
    ctx.textBaseline = 'alphabetic';
    for (let i = 0; i < N; i++) {
      const f = fx.ringFlash[i];
      ctx.beginPath(); ctx.arc(cx, cy, geom.r[i], 0, Math.PI * 2);
      ctx.strokeStyle = f > 0.01 ? mix(HUES[i], 0.16 + f * 0.55) : 'rgba(214,170,85,0.16)';
      ctx.lineWidth = 1 + f * 1.5; ctx.stroke();
    }

    // meridian
    const top = cy - geom.r[N - 1] - 18;
    const mg = ctx.createLinearGradient(0, cy, 0, top);
    mg.addColorStop(0, 'rgba(214,170,85,0.05)'); mg.addColorStop(1, 'rgba(214,170,85,0.85)');
    ctx.strokeStyle = mg; ctx.lineWidth = 1.25;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, top); ctx.stroke();
    ctx.fillStyle = '#d6aa55';
    ctx.beginPath(); ctx.moveTo(cx, top - 6); ctx.lineTo(cx - 4, top); ctx.lineTo(cx + 4, top); ctx.closePath(); ctx.fill();

    // ring labels along the meridian: note left, period right
    const fs = geom.gap > 22 ? 10.5 : 9;
    ctx.font = `500 ${fs}px "IBM Plex Mono", ui-monospace, monospace`;
    for (let i = 0; i < N; i++) {
      const y = cy - geom.r[i] - 4;
      const lit = fx.ringFlash[i];
      ctx.textAlign = 'right';
      ctx.fillStyle = lit > 0.05 ? mix(HUES[i], 0.5 + lit * 0.5) : 'rgba(236,230,214,0.5)';
      ctx.fillText(nameOf(midiOf(i)), cx - 7, y);
      if (geom.gap > 15) {
        ctx.textAlign = 'left';
        ctx.fillStyle = 'rgba(143,140,168,0.75)';
        ctx.fillText(period(i).toFixed(1) + 's', cx + 7, y);
      }
    }

    // sun
    const sr = Math.max(7, geom.r[0] * 0.38) * (1 + fx.sun * 0.18);
    const sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, sr * 3.2);
    sg.addColorStop(0, 'rgba(255,226,160,0.95)');
    sg.addColorStop(0.3, `rgba(240,180,80,${0.35 + fx.sun * 0.25})`);
    sg.addColorStop(1, 'rgba(240,180,80,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(cx, cy, sr * 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe7b0'; ctx.beginPath(); ctx.arc(cx, cy, sr, 0, Math.PI * 2); ctx.fill();

    // ripples
    for (const r of fx.ripples) {
      ctx.strokeStyle = mix(r.c, (1 - r.t) * 0.8);
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, 4 + r.t * 34, 0, Math.PI * 2); ctx.stroke();
    }

    // planets with trails
    for (const p of state.planets) {
      const R = geom.r[p.ring];
      const a = -Math.PI / 2 + p.phase * Math.PI * 2;
      const trail = Math.min(1.1, 9 / period(p.ring));
      const segs = 10;
      ctx.lineCap = 'round';
      for (let s = 0; s < segs; s++) {
        const a0 = a - trail * (s + 1) / segs, a1 = a - trail * s / segs;
        ctx.strokeStyle = mix(HUES[p.ring], 0.42 * (1 - s / segs));
        ctx.lineWidth = p.size * 0.9 * (1 - s / segs * 0.7);
        ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.stroke();
      }
      const x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
      const glow = p.size * (2.4 + p.flash * 3);
      const gg = ctx.createRadialGradient(x, y, 0, x, y, glow);
      gg.addColorStop(0, mix(HUES[p.ring], 0.55 + p.flash * 0.45)); gg.addColorStop(1, mix(HUES[p.ring], 0));
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x, y, glow, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = HUES[p.ring];
      ctx.beginPath(); ctx.arc(x, y, p.size * (1 + p.flash * 0.35), 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.beginPath(); ctx.arc(x - p.size * 0.3, y - p.size * 0.3, p.size * 0.35, 0, Math.PI * 2); ctx.fill();
    }
  }

  const rgbCache = {};
  function mix(hex, alpha) {
    let c = rgbCache[hex];
    if (!c) { const n = parseInt(hex.slice(1), 16); c = rgbCache[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
    return `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, Math.min(1, alpha)).toFixed(3)})`;
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (state.playing) {
      for (const p of state.planets) {
        p.phase += dt / period(p.ring);
        if (p.phase >= 1) { p.phase -= 1; trigger(p); }
      }
    }
    const k = Math.exp(-dt * 3.2);
    for (const p of state.planets) p.flash *= k;
    for (let i = 0; i < N; i++) fx.ringFlash[i] *= k;
    fx.sun *= Math.exp(-dt * 2.5);
    for (const r of fx.ripples) r.t += dt * 1.4;
    fx.ripples = fx.ripples.filter(r => r.t < 1);
    draw(now);
    requestAnimationFrame(frame);
  }

  function start(data) {
    data = data || {};
    if (Array.isArray(data.planets) && data.planets.length) {
      state.planets = data.planets.map(p => ({ ring: p.ring, phase: p.phase, size: p.size, flash: 0 }));
    } else seed();
    if (data.law) state.law = data.law;
    if (data.scale && SCALES[data.scale]) state.scale = data.scale;
    if (data.tempo) state.tempo = data.tempo;
    if (typeof data.playing === 'boolean') state.playing = data.playing;
    layout();
    syncControls();
    requestAnimationFrame(t => { last = t; frame(t); });
  }

  window.claude?.hot?.snapshot?.(() => ({
    planets: state.planets.map(({ ring, phase, size }) => ({ ring, phase, size })),
    law: state.law, scale: state.scale, tempo: state.tempo, playing: state.playing,
  }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
